[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ghana-mcp"
version = "1.0.0"
description = "Model Context Protocol (MCP) Server for Ghanaian Local Knowledge & Web Search"
authors = [
    { name = "Ghana Open AI & Ghana NLP" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "requests>=2.28.0",
    "beautifulsoup4>=4.12.0",
    "spacy>=3.7.0",
    "sse-starlette>=2.0.0",
]

[project.scripts]
ghana-mcp = "ghana_mcp.server:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["ghana_mcp*"]

[tool.setuptools.package-data]
"ghana_mcp" = ["data/*.json"]
